# Appended onto the generated android/gradle.properties by prepare_android.sh.
#
# The default Gradle heap on a CI runner is small, and when it runs out the
# error message points at a random compile task instead of the real cause.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

# Required by every modern Android plugin.
android.useAndroidX=true
android.enableJetifier=true

# Faster, quieter builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.warning.mode=summary

# Show full Gradle stack traces in CI logs (flutter build has no --stacktrace flag)
org.gradle.logging.stacktrace=all
