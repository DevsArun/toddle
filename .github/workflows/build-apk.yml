name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Generate Android project
        run: |
          chmod +x tools/prepare_android.sh
          ./tools/prepare_android.sh

      # CRITICAL: without this step the APK ships the stub MainActivity that
      # always answers UNAVAILABLE, and Amazon rejects the app ("IAP displays
      # error"). The SDK comes from Maven Central via patch_gradle.py — no local
      # jar is needed or allowed (a local jar causes Duplicate class errors).
      # Fully self-contained: does NOT call any tools/ script, so a stale
      # tools/enable_amazon_iap.sh in the repo can never break this step.
      - name: Enable REAL Amazon IAP bridge
        run: |
          set -euo pipefail

          # 1) Never allow a local SDK jar (Duplicate class errors). The SDK
          #    comes from Maven Central via tools/patch_gradle.py.
          rm -f android/app/libs/*.jar

          # 2) Replace the stub MainActivity with the real Amazon IAP bridge.
          cp android_overlay/amazon_iap/AmazonIapBridge.kt \
             android/app/src/main/kotlin/com/itschool/toddler_coloring/MainActivity.kt

          # 3) Declare the Amazon response receiver in the manifest (if missing).
          python3 - <<'PY'
          import io
          path = "android/app/src/main/AndroidManifest.xml"
          text = io.open(path, encoding="utf-8").read()
          receiver = '''
                  <receiver
                      android:name="com.amazon.device.iap.ResponseReceiver"
                      android:permission="com.amazon.inapp.purchasing.Permission.NOTIFY"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="com.amazon.inapp.purchasing.NOTIFY" />
                      </intent-filter>
                  </receiver>
          '''
          if "com.amazon.device.iap.ResponseReceiver" in text:
              print("receiver already present")
          else:
              text = text.replace("    </application>", receiver + "    </application>", 1)
              io.open(path, "w", encoding="utf-8").write(text)
              print("receiver added")
          PY

          # 4) ProGuard/R8 keep rules so the SDK survives release shrinking.
          python3 - <<'PY'
          import io, os, re, sys
          rules = ("# Amazon Appstore SDK - required keep rules\n"
                   "-dontwarn com.amazon.**\n"
                   "-keep class com.amazon.** { *; }\n"
                   "-keepattributes *Annotation*\n")
          pro = "android/app/proguard-rules.pro"
          existing = io.open(pro, encoding="utf-8").read() if os.path.exists(pro) else ""
          if "com.amazon." not in existing:
              io.open(pro, "a", encoding="utf-8").write(("\n" if existing and not existing.endswith("\n") else "") + rules)
              print("wrote Amazon keep rules to " + pro)
          gradle = "android/app/build.gradle.kts"
          kts = os.path.exists(gradle)
          if not kts:
              gradle = "android/app/build.gradle"
          text = io.open(gradle, encoding="utf-8").read()
          if "proguard-rules.pro" in text:
              print("proguardFiles already wired")
              sys.exit(0)
          if kts:
              line = ('            proguardFiles(\n'
                      '                getDefaultProguardFile("proguard-android-optimize.txt"),\n'
                      '                "proguard-rules.pro",\n'
                      '            )\n')
          else:
              line = "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n"
          new_text, count = re.subn(r"(buildTypes\s*\{[^{]*release\s*\{\n)", r"\1" + line.replace("\\", "\\\\"), text, count=1)
          if count != 1:
              print("ERROR: release buildType not found in " + gradle)
              sys.exit(1)
          io.open(gradle, "w", encoding="utf-8").write(new_text)
          print("wired proguardFiles into " + gradle)
          PY

          # 5) Make sure Gradle has the Maven SDK dependency and NO fileTree(libs).
          python3 - <<'PY'
          import io, os, sys
          gradle = "android/app/build.gradle.kts"
          if not os.path.exists(gradle):
              gradle = "android/app/build.gradle"
          text = io.open(gradle, encoding="utf-8").read()
          changed = False
          for bad in ('    implementation(fileTree(mapOf("dir" to "libs", "include" to listOf("*.jar"))))\n',
                      "    implementation fileTree(dir: 'libs', include: ['*.jar'])\n"):
              if bad in text:
                  text = text.replace(bad, "")
                  changed = True
                  print("removed fileTree(libs) dependency")
          if "com.amazon.device:amazon-appstore-sdk" not in text:
              if gradle.endswith(".kts"):
                  text += '\ndependencies {\n    implementation("com.amazon.device:amazon-appstore-sdk:3.0.9")\n}\n'
              else:
                  text += "\ndependencies {\n    implementation 'com.amazon.device:amazon-appstore-sdk:3.0.9'\n}\n"
              changed = True
              print("added Maven SDK dependency")
          if changed:
              io.open(gradle, "w", encoding="utf-8").write(text)
          print("gradle dependency state OK")
          PY
          # Prove the stub is gone before we even build.
          grep -q 'PurchasingService' android/app/src/main/kotlin/com/itschool/toddler_coloring/MainActivity.kt || {
            echo 'ERROR: MainActivity is still the stub, real IAP bridge not applied'; exit 1; }
          grep -q 'com.amazon.device.iap.ResponseReceiver' android/app/src/main/AndroidManifest.xml || {
            echo 'ERROR: Amazon IAP ResponseReceiver missing from manifest'; exit 1; }
          echo "Real Amazon IAP bridge active"

      - name: Confirm this is the real app, not the Flutter demo
        run: |
          grep -q 'ToddlerColoringApp' lib/main.dart
          grep -q 'shared_preferences' pubspec.yaml
          grep -q 'kArtParts' lib/data/art_specs.dart
          echo "source files intact"

      # These four values live in GitHub Settings > Secrets and variables >
      # Actions. The keystore itself never enters the repository or build log.
      - name: Configure private release certificate
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "Missing SIGNING_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "Missing SIGNING_STORE_PASSWORD secret"; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "Missing SIGNING_KEY_PASSWORD secret"; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "Missing SIGNING_KEY_ALIAS secret"; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$SIGNING_STORE_PASSWORD
          keyPassword=$SIGNING_KEY_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
          keytool -list -keystore android/app/release-keystore.jks \
            -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
          keytool -list -v -keystore android/app/release-keystore.jks \
            -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]' \
            > expected-certificate-sha256.txt
          test -s expected-certificate-sha256.txt
          echo "private release certificate loaded"

      # Belt-and-braces: no local SDK jar may ever sit in libs when the Maven
      # dependency is active, or Gradle fails with "Duplicate class".
      - name: Remove any stray Appstore SDK jars
        run: |
          rm -f android/app/libs/amazon-appstore-sdk*.jar
          ls -la android/app/libs/ 2>/dev/null || true

      - name: Build debug APK for Appetize
        run: flutter build apk --debug

      - name: Build signed Amazon release APK
        run: flutter build apk --release

      # Amazon rejects any APK carrying Android's shared debug certificate.
      # Verify the exact file before exposing it as a downloadable artifact.
      - name: Prove release APK is privately signed
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee certificate-report.txt
          if grep -qi "Android Debug" certificate-report.txt; then
            echo "ERROR: release APK still uses Android Debug certificate"
            exit 1
          fi
          ACTUAL_SHA256=$(sed -n 's/^.*Signer: certificate SHA-256 digest: //p' certificate-report.txt | head -1)
          EXPECTED_SHA256=$(cat expected-certificate-sha256.txt)
          test -n "$ACTUAL_SHA256" || { echo "Certificate digest missing from apksigner output"; exit 1; }
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK certificate does not match the permanent release key"
            exit 1
          fi
          echo "SIGNED RELEASE VERIFIED — certificate matches permanent key"

      # Final gate: the release APK itself must contain the Amazon IAP SDK
      # classes. If this fails, the APK would be rejected again by Amazon.
      - name: Prove Amazon IAP SDK is inside the release APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -p "$APK" 'classes*.dex' 2>/dev/null \
            | grep -aq 'com/amazon/device/iap' || {
            echo 'ERROR: Amazon IAP classes NOT found in release APK — do not upload this file'; exit 1; }
          echo "Amazon IAP SDK confirmed inside release APK"

      - name: Gradle diagnostics on failure
        if: failure()
        run: |
          echo '===== android/app/build.gradle(.kts) ====='
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle 2>/dev/null || true
          echo '===== android/gradle.properties ====='
          cat android/gradle.properties 2>/dev/null || true
          echo '===== AndroidManifest.xml ====='
          cat android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          echo '===== gradle-wrapper.properties ====='
          cat android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          echo '===== flutter doctor ====='
          flutter doctor -v || true

      - name: Upload Amazon release APK
        uses: actions/upload-artifact@v4
        with:
          name: AMAZON-UPLOAD-signed-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            certificate-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Appetize debug APK
        uses: actions/upload-artifact@v4
        with:
          name: APPETIZE-ONLY-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
